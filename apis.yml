name: Fliptop
description: >-
  Fliptop was a San Francisco-based predictive marketing and customer
  intelligence startup that applied data science and machine learning to CRM
  and marketing-automation data to score leads, predict conversion, and prioritize
  sales pipelines. Founded around 2009, it was acquired by LinkedIn in August 2015
  and folded into LinkedIn's Sales Solutions (Sales Navigator) product. The company
  no longer operates as an independent entity and publishes no public API, developer
  portal, or SDKs; its former domain fliptop.com now 301-redirects to
  business.linkedin.com/sales-solutions. This profile is retained in the API
  Evangelist network as a historical portfolio-company record.
